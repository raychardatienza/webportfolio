<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04090f"/><stop offset="1" stop-color="#071822"/></linearGradient>
  <radialGradient id="glow" cx="0.74" cy="0.48" r="0.55"><stop offset="0" stop-color="#10b981" stop-opacity="0.35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#10b981" stroke-opacity="0.08"/></pattern>
  <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity="0"/><stop offset="1" stop-color="#10b981" stop-opacity="0.14"/></linearGradient>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
<rect width="640" height="360" fill="url(#grid)"/>
<rect width="640" height="360" fill="url(#glow)"/>

<!-- Graphic: Server Stack, Health Pulse Waveform, Security Shield -->
<g filter="url(#neon)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Server Unit 1 -->
  <rect x="340" y="75" width="130" height="42" rx="8" stroke="#06b6d4" stroke-opacity="0.9"/>
  <circle cx="360" cy="96" r="4" fill="#10b981" stroke="none"/>
  <circle cx="376" cy="96" r="4" fill="#06b6d4" stroke="none"/>
  <line x1="400" y1="96" x2="450" y2="96" stroke="#06b6d4" stroke-opacity="0.5" stroke-dasharray="3 3"/>

  <!-- Server Unit 2 -->
  <rect x="340" y="130" width="130" height="42" rx="8" stroke="#06b6d4" stroke-opacity="0.9"/>
  <circle cx="360" cy="151" r="4" fill="#10b981" stroke="none"/>
  <circle cx="376" cy="151" r="4" fill="#10b981" stroke="none"/>
  <line x1="400" y1="151" x2="450" y2="151" stroke="#06b6d4" stroke-opacity="0.5" stroke-dasharray="3 3"/>

  <!-- Server Unit 3 -->
  <rect x="340" y="185" width="130" height="42" rx="8" stroke="#06b6d4" stroke-opacity="0.9"/>
  <circle cx="360" cy="206" r="4" fill="#10b981" stroke="none"/>
  <circle cx="376" cy="206" r="4" fill="#38bdf8" stroke="none"/>
  <line x1="400" y1="206" x2="450" y2="206" stroke="#06b6d4" stroke-opacity="0.5" stroke-dasharray="3 3"/>

  <!-- Central Security & Telemetry Shield -->
  <path d="M540 85l50 20v45c0 38-25 60-50 70-25-10-50-32-50-70v-45z" stroke="#10b981" stroke-width="2.5"/>
  <path d="M526 142l10 10 20-20" stroke="#a7f3d0" stroke-width="2.8"/>

  <!-- Dynamic ECG / Health Pulse Line -->
  <path d="M300 270 h60 l15 -25 l12 48 l18 -68 l14 45 l15 -18 l14 18 h120" stroke="#10b981" stroke-width="3"/>
  <circle cx="434" cy="225" r="5" fill="#a7f3d0" stroke="#10b981"/>
</g>

<!-- Animated Pulse Beacon -->
<g filter="url(#neon)" fill="none" stroke-width="2" stroke-linecap="round">
  <circle cx="540" cy="140" r="16" stroke="#10b981">
    <animate attributeName="r" values="16;55" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- HUD Headers and Labels -->
<text x="24" y="34" font-family="Consolas,'Courier New',monospace" font-size="13" font-weight="400" fill="#10b981" fill-opacity="0.9" text-anchor="start">// system health &amp; fleet telemetry</text>
<rect x="532" y="18" width="88" height="24" rx="6" fill="#ffffff" fill-opacity=".06" stroke="#10b981" stroke-opacity=".4"/>
<text x="576" y="34" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">MONITOR</text>
<text x="28" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff" filter="url(#neon)" letter-spacing="-1">PULSE</text>

<!-- Scanline sweep -->
<rect x="0" y="-80" width="640" height="80" fill="url(#scanG)"><animate attributeName="y" values="-80;360" dur="5s" repeatCount="indefinite" /></rect>
<rect x="0" y="356" width="640" height="4" fill="#10b981" fill-opacity="0.9"/>
</svg>
