<!doctype html>
<!--
  Redirect for the OLD portfolio (raychardatienza.github.io/webportfolio/).
  To use: in the old "webportfolio" repository, replace its index.html with this file and push.
  Visitors and search engines are sent to the new site; the canonical tag tells Google which one to keep.
  If the new site lives somewhere else (custom domain), change the URL in all three places below.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Raychard Atienza — Portfolio has moved</title>
  <link rel="canonical" href="https://raychardatienza.github.io/portfolio/" />
  <meta http-equiv="refresh" content="0; url=https://raychardatienza.github.io/portfolio/" />
  <meta name="robots" content="noindex" />
  <style>body{margin:0;display:grid;place-items:center;height:100vh;background:#05070f;color:#e6f1ff;font:16px system-ui,sans-serif}a{color:#22d3ee}</style>
  <script>location.replace('https://raychardatienza.github.io/portfolio/' + location.hash);</script>
</head>
<body>
  <p>My portfolio has moved to <a href="https://raychardatienza.github.io/portfolio/">raychardatienza.github.io/portfolio</a>.</p>
</body>
</html>
