<!doctype html>
<!-- Link-preview card source. Regenerate (from the Portfolio folder):
  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot="assets\images\og-image.png" "_src\og-image.html"
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #05070f; color: #e6f1ff; font-family: Inter, "Segoe UI", sans-serif; position: relative; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(34 211 238 / .07) 1px, transparent 1px), linear-gradient(to bottom, rgb(34 211 238 / .07) 1px, transparent 1px); background-size: 48px 48px; }
    .glow1 { position: absolute; width: 620px; height: 620px; left: -160px; top: -260px; background: radial-gradient(circle, rgb(34 211 238 / .28), transparent 65%); }
    .glow2 { position: absolute; width: 700px; height: 700px; right: -220px; bottom: -330px; background: radial-gradient(circle, rgb(139 92 246 / .3), transparent 65%); }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #22d3ee, #8b5cf6, #ff2d20); }
    .wrap { position: relative; display: flex; align-items: center; gap: 60px; height: 100%; padding: 0 80px; }
    .photo { width: 300px; height: 300px; border-radius: 36px; padding: 3px; background: conic-gradient(from 200deg, #22d3ee, #8b5cf6, #ff2d20, #22d3ee); box-shadow: 0 0 80px -10px rgb(34 211 238 / .55); flex: none; }
    .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 33px; display: block; }
    .badge { display: inline-flex; align-items: center; gap: 10px; font: 500 18px "JetBrains Mono", monospace; color: #a5f3fc; border: 1px solid rgb(34 211 238 / .3); background: rgb(34 211 238 / .07); padding: 8px 14px; border-radius: 10px; letter-spacing: .04em; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d399; }
    h1 { font: 700 72px/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; margin-top: 22px; }
    h2 { font: 600 34px/1.2 "Space Grotesk", sans-serif; margin-top: 14px; background: linear-gradient(90deg, #67e8f9, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .chips { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
    .chip { font: 500 18px "JetBrains Mono", monospace; padding: 8px 14px; border-radius: 10px; border: 1px solid rgb(34 211 238 / .2); background: rgb(255 255 255 / .03); color: #cbd5e1; }
    .chip.l { border-color: rgb(255 45 32 / .55); color: #ff6b5e; background: rgb(255 45 32 / .08); }
    .url { position: absolute; right: 80px; top: 48px; font: 500 18px "JetBrains Mono", monospace; color: #64748b; }
  </style>
</head>
<body>
  <div class="grid"></div><div class="glow1"></div><div class="glow2"></div><div class="bar"></div>
  <div class="url">raychardatienza.github.io/portfolio</div>
  <div class="wrap">
    <div class="photo"><img src="../assets/images/profile.jpg" alt="" /></div>
    <div>
      <span class="badge"><span class="dot"></span>FULL-STACK DEVELOPER · QUEZON CITY, PH</span>
      <h1>Raychard Atienza</h1>
      <h2>Building systems people rely on</h2>
      <div class="chips">
        <span class="chip l">◆ Laravel</span><span class="chip">React.js</span><span class="chip">Node.js</span><span class="chip">MySQL</span><span class="chip">CPMS · CASM · CPSCA</span>
      </div>
    </div>
  </div>
</body>
</html>
